<title>Amani — Family Continuity Check-In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #F5F3EC;
    --surface: #FDFCF8;
    --ink: #232839;
    --muted: #6C7086;
    --accent: #414F8C;
    --accent-ink: #FFFFFF;
    --accent-soft: #E8EAF4;
    --gold: #B5843A;
    --gold-soft: #F3E9D7;
    --line: #DAD6CA;
    --danger: #8C4141;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16192A;
      --surface: #1E2236;
      --ink: #E8E6DC;
      --muted: #9CA1B8;
      --accent: #97A4E0;
      --accent-ink: #141726;
      --accent-soft: #262C48;
      --gold: #D0A458;
      --gold-soft: #33301F;
      --line: #343A55;
      --danger: #D89090;
    }
  }
  :root[data-theme="light"] {
    --paper: #F5F3EC; --surface: #FDFCF8; --ink: #232839; --muted: #6C7086;
    --accent: #414F8C; --accent-ink: #FFFFFF; --accent-soft: #E8EAF4;
    --gold: #B5843A; --gold-soft: #F3E9D7; --line: #DAD6CA; --danger: #8C4141;
  }
  :root[data-theme="dark"] {
    --paper: #16192A; --surface: #1E2236; --ink: #E8E6DC; --muted: #9CA1B8;
    --accent: #97A4E0; --accent-ink: #141726; --accent-soft: #262C48;
    --gold: #D0A458; --gold-soft: #33301F; --line: #343A55; --danger: #D89090;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    max-width: 660px; margin: 0 auto; padding: 20px 20px 6px;
  }
  .brand { font-size: 21px; letter-spacing: 0.02em; }
  .brand b { font-weight: 600; }
  .hdr-right { display: flex; gap: 16px; align-items: baseline; }
  .hdr-btn {
    background: none; border: none; cursor: pointer; padding: 2px 4px;
    color: var(--muted); font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .hdr-btn:hover, .hdr-btn:focus-visible { color: var(--accent); }
  .hdr-btn[aria-pressed="true"] { color: var(--accent); border-bottom: 2px solid var(--accent); }

  /* the thread */
  .thread { max-width: 660px; margin: 8px auto 0; padding: 0 20px; }
  .thread-line { display: flex; align-items: center; }
  .knot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--line); background: var(--paper);
    transition: background 0.3s, border-color 0.3s;
  }
  .knot.done { background: var(--gold); border-color: var(--gold); }
  .knot.now { border-color: var(--accent); background: var(--accent-soft); }
  .seg { flex: 1; height: 1px; background: var(--line); }
  .seg.done { background: var(--gold); }

  main { max-width: 660px; margin: 0 auto; padding: 30px 20px 40px; }
  .screen { animation: rise 0.24s ease-out; }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 34px; line-height: 1.2; font-weight: 500; margin: 0 0 14px; text-wrap: balance; }
  h2 { font-size: 26px; line-height: 1.25; font-weight: 500; margin: 0 0 8px; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 16px; }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 10px;
  }

  .opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px; }
  .opt {
    text-align: left; cursor: pointer; width: 100%;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 13px 15px; font-family: inherit; font-size: 16.5px; line-height: 1.4;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt .d { display: block; color: var(--muted); font-size: 14.5px; margin-top: 2px; }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 26px; }
  @media (max-width: 480px) { .chips { grid-template-columns: repeat(2, 1fr); } }
  .chip {
    cursor: pointer; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: 12px 8px;
    font-family: inherit; font-size: 16px; text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip.sel { border-color: var(--accent); background: var(--accent-soft); }

  .btnrow { display: flex; gap: 12px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .btn {
    cursor: pointer; border: none; border-radius: 3px;
    background: var(--accent); color: var(--accent-ink);
    padding: 12px 26px; font-size: 15px; letter-spacing: 0.03em;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-ghost {
    cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 3px;
    color: var(--muted); padding: 11px 18px; font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .gentle {
    border-left: 3px solid var(--gold); background: var(--gold-soft);
    padding: 10px 14px; margin: 0 0 22px; font-size: 15.5px; border-radius: 0 3px 3px 0;
  }
  .aside {
    color: var(--muted); font-size: 14.5px; margin-top: 14px;
    border-top: 1px solid var(--line); padding-top: 12px;
  }

  .scriptbox {
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 0 3px 3px 0; padding: 18px 20px; margin: 20px 0 10px;
    font-size: 17.5px; line-height: 1.65;
  }
  .resist { margin: 16px 0 8px; }
  .resist .lbl {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    display: block; margin-bottom: 6px;
  }

  label.f {
    display: block; margin-bottom: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);
  }
  input[type="text"], input[type="date"], textarea {
    display: block; width: 100%; margin-top: 6px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px;
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-size: 16.5px;
  }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  textarea { min-height: 84px; resize: vertical; }
  .hint { font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 4px; display: block; }

  .task {
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
    padding: 20px 22px; margin: 4px 0 18px;
  }
  .task h3 { margin: 0 0 6px; font-size: 21px; font-weight: 500; }
  .task p { margin: 0; color: var(--muted); }
  .ritual { color: var(--gold); font-size: 17px; margin: 12px 0 4px; }

  .sheet {
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
    padding: 28px 30px; margin: 8px 0 20px;
  }
  .sheet h3 { margin: 0; font-size: 24px; font-weight: 500; }
  .sheet .date { color: var(--muted); font-size: 14px; margin: 2px 0 18px; }
  .sheet .row { margin-bottom: 14px; }
  .sheet .k {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--gold);
    display: block; margin-bottom: 3px;
  }
  .sheet .v { font-size: 16.5px; }
  .sheet .flag { border-left: 3px solid var(--accent); padding-left: 10px; font-size: 15px; color: var(--muted); }
  .sheet-foot { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 10px; color: var(--muted); font-size: 13.5px; }

  .path { list-style: none; margin: 0 0 22px; padding: 0; }
  .path li {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 13px 4px; border-bottom: 1px solid var(--line); font-size: 16.5px;
  }
  .path .pk {
    flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 6px;
    border: 1.5px solid var(--line); cursor: pointer; background: var(--paper); padding: 0;
  }
  .path .pk.done { background: var(--gold); border-color: var(--gold); }
  .path .pk:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .path li.done span.tx { color: var(--muted); }

  footer {
    max-width: 660px; margin: 0 auto; padding: 10px 20px 36px;
    color: var(--muted); font-size: 13.5px; border-top: 1px solid var(--line);
  }
  footer .legal { margin-top: 6px; font-size: 12.5px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(20, 22, 38, 0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay .card {
    background: var(--surface); color: var(--ink); border-radius: 3px;
    padding: 30px 34px; max-width: 380px; text-align: center; font-size: 18px;
  }
  .overlay .card .btn { margin-top: 18px; }

  .btn.wa { background: #1FA855; color: #FFFFFF; }
  .btn.wa:hover { filter: brightness(1.06); }

  @media (max-width: 520px) {
    body { font-size: 16px; }
    header { padding: 14px 16px 4px; }
    .thread { padding: 0 16px; }
    main { padding: 22px 16px calc(30px + env(safe-area-inset-bottom)); }
    h1 { font-size: 26px; }
    h2 { font-size: 22px; }
    .btnrow { flex-direction: column; align-items: stretch; }
    .btn, .btn-ghost { width: 100%; padding: 14px; font-size: 16px; text-align: center; }
    .opt { padding: 14px; }
    .chip { padding: 13px 6px; font-size: 15px; }
    .sheet { padding: 20px 18px; }
    .scriptbox { padding: 15px 16px; font-size: 16.5px; }
    footer { padding: 10px 16px calc(28px + env(safe-area-inset-bottom)); }
  }

  @media print {
    header, .thread, footer, .no-print, .btnrow { display: none !important; }
    body { background: #fff; color: #111; }
    main { padding: 0; max-width: none; }
    .sheet { border: none; padding: 0; background: #fff; }
    .sheet .k { color: #555; }
    .sheet .flag { color: #333; }
  }
</style>

<header>
  <div class="brand"><b>Amani</b></div>

/* ---------- state ---------- */
var ORDER = ["welcome","context","household","countries","register","values","talk","week","note","path"];
var GENTLE = { loss: true, illness: true };

var state = load() || {
  lang: "en", screen: "welcome",
  context: null, household: [], multi: null, countries: "",
  register: null, values: [],
  audience: null, reaction: null,
  weekDone: false,
  note: { by: "", call: "", speak: "", where: "" },
  review: "", pathDone: [false, false, false, false, false, false]
};

function load() {
  try {
    var raw = localStorage.getItem("amani-v1");
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem("amani-v1", JSON.stringify(state)); } catch (e) {}
}
function t() { return T[state.lang]; }
function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------- navigation ---------- */
function go(screen) { state.screen = screen; save(); render(); window.scrollTo(0, 0); }
function next() { var i = ORDER.indexOf(state.screen); if (i < ORDER.length - 1) go(ORDER[i + 1]); }
function back() { var i = ORDER.indexOf(state.screen); if (i > 0) go(ORDER[i - 1]); }
function setLang(l) { state.lang = l; save(); render(); }

/* ---------- selections ---------- */
function pickContext(c) { state.context = c; save(); render(); }
function toggleHH(h) {
  var i = state.household.indexOf(h);
  if (i >= 0) state.household.splice(i, 1); else state.household.push(h);
  save(); render();
}
function pickMulti(v) { state.multi = v; save(); render(); }
function setCountries(v) { state.countries = v; save(); }
function pickRegister(r) { state.register = r; save(); render(); }
function toggleVal(v) {
  var i = state.values.indexOf(v);
  if (i >= 0) state.values.splice(i, 1);
  else if (state.values.length < 3) state.values.push(v);
  save(); render();
}
function pickAud(a) { state.audience = a; save(); render(); }
function pickRea(r) { state.reaction = r; save(); render(); }
function markWeekDone() { state.weekDone = true; state.pathDone[0] = true; save(); render(); }
function togglePath(i) { state.pathDone[i] = !state.pathDone[i]; save(); render(); }
function setNote(k, v) { state.note[k] = v; save(); }
function setReview(v) { state.review = v; save(); }

function startOver() { go("welcome"); }
function eraseAll() {
  if (confirm(t().eraseConfirm)) {
    try { localStorage.removeItem("amani-v1"); } catch (e) {}
    location.reload();
  }
}

/* ---------- script builder (deterministic, no network) ---------- */
function buildScript() {
  var L = t();
  var ctx = state.context || "calm";
  var reg = state.register || "gentle";
  var parts = [
    L.trg[ctx],
    L.rsr[reg],
    L.askWrap.replace("{ask}", L.asks[ctx]),
    L.pauseLine
  ];
  return parts.join(" ");
}
function nextQuestion() {
  var L = t();
  if (state.context === "kids") return L.nQkids;
  if (state.context === "moving") return L.nQmoving;
  return L.nQdefault;
}
function noteAsText() {
  var L = t();
  var lines = [];
  lines.push("— " + L.nTitle + " —");
  if (state.note.by) lines.push(L.nBy.replace(/ \(.*\)/, "") + ": " + state.note.by);
  lines.push(L.nMatters + ": " + state.values.map(function (v) { return L.val[v]; }).join(", "));
  if (state.household.length) lines.push(L.nProtect + ": " + state.household.map(function (h) { return L.hh[h]; }).join(", "));
  if (state.note.call) lines.push(L.nCall + ": " + state.note.call);
  if (state.note.speak) lines.push(L.nSpeak + ": " + state.note.speak);
  if (state.note.where) lines.push(L.nWhere + ": " + state.note.where);
  if (state.multi === "yes" && state.countries) lines.push(L.nCountries + ": " + state.countries + " — " + L.cFlag);
  lines.push(L.nStep + ": " + L.task[state.context || "calm"].t + (state.weekDone ? " ✓" : ""));
  lines.push(L.nQ + ": " + nextQuestion());
  if (state.review) lines.push(L.nReview + " " + state.review);
  lines.push(L.sheetFoot);
  return lines.join("\n");
}
function copyText(txt, btnId) {
  function done() {
    var b = document.getElementById(btnId);
    if (b) { b.textContent = t().copied; setTimeout(render, 1200); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, done);
  } else {
    var ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); done();
  }
}
function copyScript() { copyText(buildScript(), "copyScriptBtn"); }
function copyNote() { copyText(noteAsText(), "copyNoteBtn"); }
function shareWA(kind) {
  var txt = kind === "note" ? noteAsText() : buildScript();
  window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank", "noopener");
}

/* ---------- pause ---------- */
function showPause() {
  save();
  var host = document.getElementById("overlayHost");
  host.innerHTML =
    '<div class="overlay" role="dialog" aria-modal="true">' +
    '<div class="card">' + esc(t().pausedMsg) +
    '<div><button class="btn" onclick="hidePause()">' + esc(t().ok) + "</button></div>" +
    "</div></div>";
}
function hidePause() { document.getElementById("overlayHost").innerHTML = ""; }

/* ---------- render helpers ---------- */
function optBtn(sel, onclick, label, desc) {
  return '<button class="opt' + (sel ? " sel" : "") + '" onclick="' + onclick + '">' +
    esc(label) + (desc ? '<span class="d">' + esc(desc) + "</span>" : "") + "</button>";
}
function navRow(nextEnabled, extra) {
  var L = t();
  var h = '<div class="btnrow no-print">';
  h += '<button class="btn-ghost" onclick="back()">' + esc(L.back) + "</button>";
  h += '<button class="btn" onclick="next()"' + (nextEnabled ? "" : " disabled") + ">" + esc(L.next) + "</button>";
  if (extra) h += extra;
  h += "</div>";
  return h;
}

/* ---------- screens ---------- */
function sWelcome() {
  var L = t();
  return '<div class="screen">' +
    "<h1>" + esc(L.wTitle) + "</h1>" +
    '<p style="font-size:18px">' + esc(L.wLaw) + "</p>" +
    '<p class="sub">' + esc(L.wSub) + "</p>" +
    '<div class="btnrow"><button class="btn" onclick="next()">' + esc(L.begin) + "</button>" +
    '<button class="btn-ghost" onclick="eraseAll()">' + esc(L.erase) + "</button></div>" +
    "</div>";
}

function sContext() {
  var L = t(), h = '<div class="screen">';
  h += '<div class="eyebrow">' + esc(L.whyEyebrow) + "</div><h2>" + esc(L.whyTitle) + "</h2>";
  h += '<p class="sub">' + esc(L.whySub) + "</p>";
  h += '<div class="opts">';
  for (var k in L.ctx) {
    h += optBtn(state.context === k, "pickContext('" + k + "')", L.ctx[k].l, L.ctx[k].d);
  }
  h += "</div>";
  if (state.context && GENTLE[state.context]) h += '<div class="gentle">' + esc(L.gentleNote) + "</div>";
  h += navRow(!!state.context) + "</div>";
  return h;

  for (var k in L.hh) {
    h += optBtn(state.household.indexOf(k) >= 0, "toggleHH('" + k + "')", L.hh[k], null);

  var L = t(), h = '<div class="screen">';

  var L = t(), h = '<div class="screen">';

  h += '<label class="f">' + esc(L.reaLbl) + "</label><div class=\"chips\">";

  h += '<label class="f">' + esc(L.nBy) + '<input type="text" value="' + esc(state.note.by) + '" oninput="setNote(\'by\', this.value)"></label>';
  h += '<label class="f">' + esc(L.nCall) + '<input type="text" value="' + esc(state.note.call) + '" placeholder="' + esc(L.nCallPh) + '" oninput="setNote(\'call\', this.value)"></label>';
  h += '<label class="f">' + esc(L.nSpeak) + '<input type="text" value="' + esc(state.note.speak) + '" placeholder="' + esc(L.nSpeakPh) + '" oninput="setNote(\'speak\', this.value)"></label>';
  h += '<label class="f">' + esc(L.nWhere) + '<textarea placeholder="' + esc(L.nWherePh) + '" oninput="setNote(\'where\', this.value)">' + esc(state.note.where) + "</textarea>" +
    '<span class="hint">' + esc(L.nWhereHint) + "</span></label>";
  h += '<label class="f">' + esc(L.nReview) + '<input type="date" value="' + esc(state.review) + '" oninput="setReview(this.value)"></label>';
  h += "</div>";

  h += '<div class="sheet" id="sheet">';
  h += "<h3>" + esc(L.nTitle) + "</h3>";
  var dparts = [];
  if (state.note.by) dparts.push(state.note.by);
  dparts.push(new Date().toLocaleDateString(state.lang === "fr" ? "fr-FR" : "en-US", { year: "numeric", month: "long", day: "numeric" }));
  h += '<div class="date">' + esc(dparts.join(" · ")) + "</div>";
  h += '<div class="row"><span class="k">' + esc(L.nMatters) + '</span><span class="v">' +
    esc(state.values.map(function (v) { return L.val[v]; }).join(" · ") || "—") + "</span></div>";
  if (state.household.length) {
    h += '<div class="row"><span class="k">' + esc(L.nProtect) + '</span><span class="v">' +
      esc(state.household.map(function (x) { return L.hh[x]; }).join(" · ")) + "</span></div>";
  }
  h += '<div class="row"><span class="k">' + esc(L.nCall) + '</span><span class="v">' + esc(state.note.call || "—") + "</span></div>";
  h += '<div class="row"><span class="k">' + esc(L.nSpeak) + '</span><span class="v">' + esc(state.note.speak || "—") + "</span></div>";
  h += '<div class="row"><span class="k">' + esc(L.nWhere) + '</span><span class="v">' + esc(state.note.where || "—") + "</span></div>";
  if (state.multi === "yes" && state.countries) {
    h += '<div class="row"><span class="k">' + esc(L.nCountries) + '</span><span class="v">' + esc(state.countries) + "</span>" +
      '<div class="flag">' + esc(L.cFlag) + "</div></div>";
  }
  h += '<div class="row"><span class="k">' + esc(L.nStep) + '</span><span class="v">' + esc(L.task[ctx].t) + (state.weekDone ? " ✓" : "") + "</span></div>";
  h += '<div class="row"><span class="k">' + esc(L.nQ) + '</span><span class="v">' + esc(nextQuestion()) + "</span></div>";
  if (state.review) h += '<div class="row"><span class="k">' + esc(L.nReview) + '</span><span class="v">' + esc(state.review) + "</span></div>";
  h += '<div class="sheet-foot">' + esc(L.sheetFoot) + "</div>";
  h += "</div>";

  h += '<div class="btnrow no-print">';
  h += '<button class="btn wa" onclick="shareWA(\'note\')">' + esc(L.waShare) + "</button>";
  h += '<button class="btn-ghost" id="copyNoteBtn" onclick="copyNote()">' + esc(L.copyNote) + "</button>";
  h += '<button class="btn-ghost" onclick="window.print()">' + esc(L.print) + "</button>";
  h += "</div>";
  h += '<div class="btnrow no-print">';
  h += '<button class="btn-ghost" onclick="back()">' + esc(L.back) + "</button>";
  h += '<button class="btn" onclick="next()">' + esc(L.next) + "</button>";
  h += "</div></div>";
  return h;
}

function sPath() {
  var L = t(), h = '<div class="screen">';
  h += '<div class="eyebrow">' + esc(L.pEyebrow) + "</div><h2>" + esc(L.pTitle) + "</h2>";
  h += '<p class="sub">' + esc(L.pSub) + "</p><ol class=\"path\">";
  for (var i = 0; i < L.path.length; i++) {
    var done = !!state.pathDone[i];
    h += '<li class="' + (done ? "done" : "") + '">' +
      '<button class="pk' + (done ? " done" : "") + '" onclick="togglePath(' + i + ')" aria-label="' + esc(L.markDone) + '"></button>' +
      '<span class="tx">' + esc(L.path[i]) + "</span></li>";
  }
  h += "</ol>";
  var doneCount = state.pathDone.filter(Boolean).length;
  if (doneCount > 0) h += '<p class="ritual">' + esc(L.doneRitual) + "</p>";
  h += '<div class="btnrow">';
  h += '<button class="btn-ghost" onclick="go(\'note\')">' + esc(L.toNote) + "</button>";
  h += '<button class="btn-ghost" onclick="startOver()">' + esc(L.startOver) + "</button>";
  h += "</div></div>";
  return h;
}

/* ---------- render ---------- */
var SCREENS = {
  welcome: sWelcome, context: sContext, household: sHousehold, countries: sCountries,
  register: sRegister, values: sValues, talk: sTalk, week: sWeek, note: sNote, path: sPath
};

function renderThread() {
  var i = ORDER.indexOf(state.screen), h = "";
  for (var k = 0; k < ORDER.length; k++) {
    var cls = k < i ? "done" : (k === i ? "now" : "");
    h += '<div class="knot ' + cls + '"></div>';
    if (k < ORDER.length - 1) h += '<div class="seg ' + (k < i ? "done" : "") + '"></div>';
  }
  document.getElementById("thread").innerHTML = h;
}

function render() {
  var L = t();
  document.getElementById("langEn").setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");
  document.getElementById("langFr").setAttribute("aria-pressed", state.lang === "fr" ? "true" : "false");
  document.getElementById("pauseBtn").textContent = L.pause;
  document.getElementById("footTag").textContent = L.footTag;
  document.getElementById("footLegal").textContent = L.footLegal;
  document.documentElement.lang = state.lang;
  renderThread();
  document.getElementById("app").innerHTML = (SCREENS[state.screen] || sWelcome)();
}

render();
</script>
